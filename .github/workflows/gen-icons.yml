name: gen-icons
on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 01:00 生成
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node gen-icons.mjs 365
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'gen icons'
          file_pattern: icons/
