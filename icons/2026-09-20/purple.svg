<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F4F0"/>
      <stop offset="1" stop-color="#ECE8E1"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B6A8D8" stop-opacity="0.6"/>
      <stop offset="0.55" stop-color="#B6A8D8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B6A8D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8D7FB8" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#8D7FB8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8D7FB8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.04 0 0 0 0 0.05 0 0 0 0 0.07 0 0 0 0.05 0"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="16" y="16" width="480" height="480" rx="56"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="104" cy="104" r="230" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="428" cy="436" r="250" fill="url(#glowB)" filter="url(#soft)"/>
  <rect x="18" y="30" width="476" height="476" rx="54" fill="#3E4C55" opacity="0.16" filter="url(#soft)"/>
  <g clip-path="url(#cardClip)" filter="url(#frost)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="104" cy="104" r="230" fill="url(#glowA)"/>
    <circle cx="428" cy="436" r="250" fill="url(#glowB)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="56" fill="rgba(255,255,255,0.55)"/>
  <rect x="16" y="16" width="480" height="480" rx="56" clip-path="url(#cardClip)" filter="url(#grain)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="55.5" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
  <rect x="234" y="108" width="44" height="4" rx="2" fill="#B6A8D8" opacity="0.65"/>
  <text x="256" y="90" font-size="40" font-weight="600" fill="rgba(46, 59, 69, 0.66)" text-anchor="middle" letter-spacing="4" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">九月</text>
  <text x="256" y="440" font-size="250" font-weight="700" fill="#2E3B45" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">20</text>
  <text x="256" y="496" font-size="38" font-weight="500" fill="rgba(46, 59, 69, 0.5)" text-anchor="middle" letter-spacing="2" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">星期日</text>
</svg>